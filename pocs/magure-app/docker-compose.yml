version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: maglabs_postgres
    environment:
      POSTGRES_DB: ${DB_NAME:-maglabs}
      POSTGRES_USER: ${DB_USER:-maglabs}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-maglabs123}
      POSTGRES_HOST_AUTH_METHOD: trust
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d
    ports:
      - "${DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-maglabs}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - maglabs_network


  # Django Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: development
    container_name: maglabs_backend
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings.development
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=${DB_NAME:-maglabs}
      - DB_USER=${DB_USER:-maglabs}
      - DB_PASSWORD=${DB_PASSWORD:-maglabs123}
      - DEBUG=true
      - SECRET_KEY=${SECRET_KEY:-dev-secret-key-change-in-production}
      - ALLOWED_HOSTS=localhost,127.0.0.1,backend,*.maglabs.local,*.maglabs.api
      - CORS_ALLOWED_ORIGINS=http://localhost:3000,http://frontend:3000,http://*.maglabs.local
      - MAGLABS_API_URL=${MAGLABS_API_URL:-http://localhost:8001}
      - MAGLABS_API_KEY=${MAGLABS_API_KEY:-dev-api-key}
    volumes:
      - ./backend:/app
      - backend_static:/app/staticfiles
      - backend_media:/app/mediafiles
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - maglabs_network
    restart: unless-stopped

  # React Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: production
    container_name: maglabs_frontend
    environment:
      - NODE_ENV=development
      - REACT_APP_API_URL=http://localhost/api
      - REACT_APP_WS_URL=ws://localhost/ws
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - frontend_build:/app/dist
    ports:
      - "3000:3000"
    depends_on:
      - backend
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - maglabs_network
    restart: unless-stopped

  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: maglabs_nginx
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./nginx/conf.d:/etc/nginx/conf.d
      - ./nginx/ssl:/etc/nginx/ssl
      - backend_static:/var/www/static
      - backend_media:/var/www/media
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - frontend
      - backend
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - maglabs_network
    restart: unless-stopped

  # Development Tools (optional)
  mailhog:
    image: mailhog/mailhog:latest
    container_name: maglabs_mailhog
    ports:
      - "1025:1025"  # SMTP
      - "8025:8025"  # Web UI
    networks:
      - maglabs_network
    profiles:
      - development

volumes:
  postgres_data:
    driver: local
  backend_static:
    driver: local
  backend_media:
    driver: local
  frontend_build:
    driver: local

networks:
  maglabs_network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16