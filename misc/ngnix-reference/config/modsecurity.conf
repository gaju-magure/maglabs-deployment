# -- Rule engine initialization ----------------------------------------------
SecRuleEngine On
SecRequestBodyAccess On
SecRule REQUEST_HEADERS:Content-Type "text/xml" \
     "id:'200000',phase:1,t:none,t:lowercase,pass,nolog,ctl:requestBodyProcessor=XML"
SecRule REQUEST_HEADERS:Content-Type "application/xml" \
     "id:'200001',phase:1,t:none,t:lowercase,pass,nolog,ctl:requestBodyProcessor=XML"
SecRule REQUEST_HEADERS:Content-Type "text/xml" \
     "id:'200002',phase:1,t:none,t:lowercase,pass,nolog,ctl:requestBodyProcessor=XML"
SecRequestBodyLimit 13107200
SecRequestBodyNoFilesLimit 131072
SecRequestBodyInMemoryLimit 131072
SecRequestBodyLimitAction Reject
SecRule REQBODY_ERROR "!@eq 0" \
"id:'200003', phase:2,t:none,log,deny,status:400,msg:'Failed to parse request body.',logdata:'%{reqbody_error_msg}',severity:2"
SecRule MULTIPART_STRICT_ERROR "!@eq 0" \
"id:'200004',phase:2,t:none,log,deny,status:400, \
msg:'Multipart request body failed strict validation: \
PE %{REQBODY_PROCESSOR_ERROR}, \
BQ %{MULTIPART_BOUNDARY_QUOTED}, \
BW %{MULTIPART_BOUNDARY_WHITESPACE}, \
DB %{MULTIPART_DATA_BEFORE}, \
DA %{MULTIPART_DATA_AFTER}, \
HF %{MULTIPART_HEADER_FOLDING}, \
LF %{MULTIPART_LF_LINE}, \
SM %{MULTIPART_MISSING_SEMICOLON}, \
IQ %{MULTIPART_INVALID_QUOTING}, \
IP %{MULTIPART_INVALID_PART}, \
IH %{MULTIPART_INVALID_HEADER_FOLDING}, \
FL %{MULTIPART_FILE_LIMIT_EXCEEDED}'"

SecRule MULTIPART_UNMATCHED_BOUNDARY "!@eq 0" \
"id:'200005',phase:2,t:none,log,deny,status:44,msg:'Multipart parser detected a possible unmatched boundary.'"

SecPcreMatchLimit 1000
SecPcreMatchLimitRecursion 1000

SecRule TX:/^MSC_/ "!@streq 0" \
        "id:'200006',phase:2,t:none,deny,msg:'ModSecurity internal error flagged: %{MATCHED_VAR_NAME}'"

SecResponseBodyAccess Off
SecDebugLog /var/log/modsecurity/debug.log
SecDebugLogLevel 0
SecAuditEngine RelevantOnly
SecAuditLogRelevantStatus "^(?:5|4(?!04))"
SecAuditLogParts ABDEFHIJZ
SecAuditLogType Serial
SecAuditLog /var/log/modsecurity/modsec_audit.log
SecArgumentSeparator &
SecCookieFormat 0
SecTmpDir /tmp/
SecDataDir /tmp/

# -- ModSecurity Rules
SecRule ARGS "@detectSQLi" \
    "id:1001,\
    phase:2,\
    block,\
    msg:'SQL Injection Attack Detected',\
    logdata:'Matched Data: %{MATCHED_VAR} found within %{MATCHED_VAR_NAME}',\
    tag:'application-multi',\
    tag:'language-multi',\
    tag:'platform-multi',\
    tag:'attack-sqli',\
    severity:'CRITICAL'"

SecRule ARGS "@detectXSS" \
    "id:1002,\
    phase:2,\
    block,\
    msg:'XSS Attack Detected',\
    logdata:'Matched Data: %{MATCHED_VAR} found within %{MATCHED_VAR_NAME}',\
    tag:'application-multi',\
    tag:'language-multi',\
    tag:'platform-multi',\
    tag:'attack-xss',\
    severity:'CRITICAL'"

# Block common attack patterns
SecRule REQUEST_URI "@beginsWith /admin" \
    "id:1003,\
    phase:1,\
    block,\
    msg:'Admin path access denied',\
    tag:'security',\
    severity:'WARNING'"

SecRule REQUEST_URI "@contains .." \
    "id:1004,\
    phase:1,\
    block,\
    msg:'Path traversal attack detected',\
    tag:'attack-path-traversal',\
    severity:'CRITICAL'"

SecRule REQUEST_URI "@rx (?i:(?:[\s'\"`´''\x00-\x08\x0B\x0C\x0E-\x1F\x7F]+.*?)?(?:union|select|insert|delete|update|drop|create|replace|alter|exec|execute|truncate|declare|merge)\b)" \
    "id:1005,\
    phase:1,\
    block,\
    msg:'SQL Injection keyword detected in URI',\
    tag:'attack-sqli',\
    severity:'CRITICAL'"

# Block file upload attacks
SecRule FILES_TMPNAMES "@inspectFile /etc/modsecurity/util/av.sh" \
    "id:1006,\
    phase:2,\
    block,\
    msg:'Malicious file upload detected',\
    tag:'attack-file-upload',\
    severity:'CRITICAL'"

# Rate limiting rules
SecAction \
    "id:1007,\
    phase:1,\
    initcol:ip=%{REMOTE_ADDR},\
    pass,\
    nolog"

SecRule IP:REQUEST_COUNT "@gt 100" \
    "id:1008,\
    phase:1,\
    block,\
    msg:'Rate limit exceeded - too many requests',\
    setvar:ip.block_time=%{TIME_EPOCH},\
    expirevar:ip.block_time=300,\
    tag:'dos-protection',\
    severity:'WARNING'"

# Block requests with no User-Agent
SecRule REQUEST_HEADERS:User-Agent "@streq " \
    "id:1009,\
    phase:1,\
    block,\
    msg:'Request missing User-Agent header',\
    tag:'protocol-violation',\
    severity:'NOTICE'"

# Block requests with suspicious User-Agents
SecRule REQUEST_HEADERS:User-Agent "@rx (?i:sqlmap|nikto|netsparker|acunetix|nmap|masscan|zap|burp)" \
    "id:1010,\
    phase:1,\
    block,\
    msg:'Malicious User-Agent detected',\
    tag:'attack-reputation-scanner',\
    severity:'WARNING'"

# Include OWASP Core Rule Set
Include "/etc/nginx/modsecurity-crs/crs-setup.conf"
Include "/etc/nginx/modsecurity-crs/rules/*.conf"