version: '3.8'

services:
  # Remove local database - use AWS RDS
  postgres:
    profiles:
      - disabled


  # Django Backend - AWS ECS configuration
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: production
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings.production
      # AWS RDS Database
      - DB_HOST=${AWS_RDS_HOST}
      - DB_PORT=${AWS_RDS_PORT:-5432}
      - DB_NAME=${AWS_RDS_DB_NAME}
      - DB_USER=${AWS_RDS_USERNAME}
      - DB_PASSWORD=${AWS_RDS_PASSWORD}
      # Django settings
      - DEBUG=false
      - SECRET_KEY=${SECRET_KEY}
      - ALLOWED_HOSTS=${ALLOWED_HOSTS}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS}
      # MagLabs API
      - MAGLABS_API_URL=${MAGLABS_API_URL}
      - MAGLABS_API_KEY=${MAGLABS_API_KEY}
      # AWS Configuration
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - AWS_STORAGE_BUCKET_NAME=${AWS_STORAGE_BUCKET_NAME}
      - AWS_S3_REGION_NAME=${AWS_S3_REGION_NAME}
      - AWS_S3_CUSTOM_DOMAIN=${AWS_S3_CUSTOM_DOMAIN}
      - AWS_CLOUDFRONT_DOMAIN=${AWS_CLOUDFRONT_DOMAIN}
      - USE_S3=true
      # Email configuration (AWS SES)
      - EMAIL_BACKEND=django_ses.SESBackend
      - AWS_SES_REGION_NAME=${AWS_SES_REGION_NAME}
      - DEFAULT_FROM_EMAIL=${DEFAULT_FROM_EMAIL}
      # Monitoring
      - SENTRY_DSN=${SENTRY_DSN}
      - AWS_XRAY_TRACING_NAME=${AWS_XRAY_TRACING_NAME}
      - AWS_XRAY_CONTEXT_MISSING=LOG_ERROR
      # ECS Task specific
      - AWS_EXECUTION_ENV=AWS_ECS_FARGATE
      - AWS_DEFAULT_REGION=${AWS_DEFAULT_REGION}
    volumes:
      - ./backend/logs:/app/logs
    ports:
      - "8000:8000"
    logging:
      driver: awslogs
      options:
        awslogs-group: "/ecs/maglabs-backend"
        awslogs-region: ${AWS_DEFAULT_REGION}
        awslogs-stream-prefix: "ecs"
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: '1.0'
        reservations:
          memory: 1G
          cpus: '0.5'

  # React Frontend - AWS ECS configuration
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: production
      args:
        REACT_APP_API_URL: ${FRONTEND_API_URL}
        REACT_APP_WS_URL: ${FRONTEND_WS_URL}
        REACT_APP_SENTRY_DSN: ${FRONTEND_SENTRY_DSN}
        REACT_APP_ENVIRONMENT: production
        REACT_APP_AWS_REGION: ${AWS_DEFAULT_REGION}
    ports:
      - "3000:3000"
    logging:
      driver: awslogs
      options:
        awslogs-group: "/ecs/maglabs-frontend"
        awslogs-region: ${AWS_DEFAULT_REGION}
        awslogs-stream-prefix: "ecs"
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
        reservations:
          memory: 256M
          cpus: '0.25'

  # Nginx Reverse Proxy - AWS ALB integration
  nginx:
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./nginx/conf.d/aws.conf:/etc/nginx/conf.d/default.conf
      - ./nginx/ssl:/etc/nginx/ssl
    environment:
      - NGINX_WORKER_PROCESSES=auto
      - NGINX_WORKER_CONNECTIONS=1024
      - AWS_ALB_DNS=${AWS_ALB_DNS}
      - PRIMARY_DOMAIN=${PRIMARY_DOMAIN}
    ports:
      - "80:80"
      - "443:443"
    logging:
      driver: awslogs
      options:
        awslogs-group: "/ecs/maglabs-nginx"
        awslogs-region: ${AWS_DEFAULT_REGION}
        awslogs-stream-prefix: "ecs"
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
        reservations:
          memory: 256M
          cpus: '0.25'


volumes:
  # Remove local volumes - use AWS EFS or S3 for persistent storage
  postgres_data:
    profiles:
      - disabled
  backend_static:
    profiles:
      - disabled  # Use S3 for static files
  backend_media:
    profiles:
      - disabled  # Use S3 for media files
  frontend_build:
    profiles:
      - disabled  # Use S3/CloudFront for frontend

networks:
  default:
    external:
      name: bridge  # Use default AWS VPC networking