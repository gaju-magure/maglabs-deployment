services:
  # Python FastAPI Backend
  backend:
    build:
      context: ./backend-python
      dockerfile: Dockerfile
    container_name: idea_hub_backend_python
    env_file:
      - ./backend-python/.env # Load environment variables for the backend
    ports:
      - "8000:8000" # Expose backend port (FastAPI default)
    volumes:
      - ./backend-python:/app # Mount code for hot-reloading if uvicorn --reload is used
    # command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload # Optional: override CMD for dev
    networks:
      - idea_hub_network
    restart: unless-stopped

  # React Frontend (served by Nginx)
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: idea_hub_frontend_react
    environment:
      # Pass Supabase environment variables explicitly for runtime config generation
      - VITE_SUPABASE_URL=${VITE_SUPABASE_URL}
      - VITE_SUPABASE_ANON_KEY=${VITE_SUPABASE_ANON_KEY}
    env_file:
      - ./.env.local # Also load from file as backup
    ports:
      - "3000:80" # Map host port 3000 to Nginx container port 80
    depends_on:
      - backend # Optional: ensure backend starts before frontend (for health checks, etc.)
    networks:
      - idea_hub_network
    restart: unless-stopped

  # Optional: Nginx Reverse Proxy (for local development to handle routing and CORS)
  # This proxy will listen on port 80 (or another port like 8080) and route:
  # - /api/* requests to the backend service (port 8000)
  # - / (root) and other requests to the frontend service (port 80, which is Nginx serving React)
  nginx_proxy:
    image: nginx:1.25-alpine
    container_name: idea_hub_nginx_proxy
    ports:
      - "8080:80" # Main entry point for the application, changed host port to 8080
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro # Custom Nginx configuration
    depends_on:
      - frontend
      - backend
    networks:
      - idea_hub_network
    restart: unless-stopped

networks:
  idea_hub_network:
    driver: bridge

# Notes:
# 1. Backend .env file: Ensure `backend-python/.env` exists and is correctly populated with
#    SUPABASE_URL, SUPABASE_SERVICE_ROLE_KEY, SUPABASE_ANON_KEY, SUPABASE_JWT_SECRET, GEMINI_API_KEY.
#    For `BACKEND_CORS_ORIGINS` in the backend's .env, you might need to include the proxy's address
#    or allow '*' for development if requests come directly to backend's exposed port.
#    If using the nginx_proxy, the backend might only need to allow requests from the proxy.
#
# 2. Frontend API calls: The React app should make API calls to `/api/...`.
#    The nginx_proxy will route these to the backend. If not using the proxy,
#    the React app would call `http://localhost:8000/api/...`.
#    Ensure VITE_API_BASE_URL (or similar env var in React app) is set accordingly.
#    If using the proxy, VITE_API_BASE_URL would be just `/api` (relative to its own origin).
#
# 3. Nginx Configuration (`nginx.conf`): This file needs to be created in the project root.
#    It will define the reverse proxy rules.
