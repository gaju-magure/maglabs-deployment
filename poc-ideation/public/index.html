<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>AI Ideation Chat (Dark Mode)</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #121212;
      color: #e0e0e0;
      margin: 0;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .chat-container {
      display: flex;
      flex-direction: column;
      height: 90vh;
      width: 100%;
      max-width: 700px;
      background: #1f1f1f;
      border-radius: 10px;
      padding: 1rem;
      box-shadow: 0 2px 12px rgba(0, 0, 0, 0.4);
    }

    .chat-log {
      flex: 1;
      overflow-y: auto;
      padding: 1rem;
      border-bottom: 1px solid #333;
    }

    .message {
      padding: 0.8rem 1rem;
      margin: 0.5rem 0;
      border-radius: 10px;
      line-height: 1.4;
      white-space: pre-wrap;
    }

    .user {
      background-color: #2d68f0;
      color: #fff;
      text-align: right;
      margin-left: auto;
      max-width: 80%;
    }

    .bot {
      background-color: #2a2a2a;
      margin-right: auto;
      max-width: 80%;
    }

    form {
      display: flex;
      gap: 0.5rem;
      padding-top: 1rem;
    }

    textarea {
      flex: 1;
      padding: 0.8rem;
      font-size: 1rem;
      background-color: #2b2b2b;
      color: #e0e0e0;
      border: 1px solid #444;
      border-radius: 5px;
      resize: none;
    }

    button {
      padding: 0.8rem 1.2rem;
      background-color: #4f8ef7;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }

    button:hover {
      background-color: #3772d6;
    }

    #submitBtn {
      margin-top: 0.5rem;
      display: none;
    }

    ::-webkit-scrollbar {
      width: 8px;
    }

    ::-webkit-scrollbar-thumb {
      background: #444;
      border-radius: 4px;
    }

    ::-webkit-scrollbar-track {
      background: transparent;
    }
  </style>
</head>
<body>
  <div class="chat-container">
    <div id="chatLog" class="chat-log"></div>

    <form id="chatForm">
      <textarea id="ideaInput" rows="2" placeholder="Type your idea or follow-up..."></textarea>
      <button type="submit">Send</button>
    </form>

    <button id="submitBtn">Submit Refined Idea for Scoring</button>
  </div>

  <script>
    const chatLog = document.getElementById('chatLog');
    const form = document.getElementById('chatForm');
    const input = document.getElementById('ideaInput');
    const submitBtn = document.getElementById('submitBtn');

    let conversationHistory = [];

    function appendMessage(content, sender = 'bot') {
      const message = document.createElement('div');
      message.className = `message ${sender}`;
      message.textContent = content;
      chatLog.appendChild(message);
      chatLog.scrollTop = chatLog.scrollHeight;
    }

    form.onsubmit = async (e) => {
      e.preventDefault();
      const userText = input.value.trim();
      if (!userText) return;

      appendMessage(userText, 'user');
      conversationHistory.push({ role: 'user', content: userText });
      input.value = '';

      appendMessage("Thinking...", 'bot');

      const res = await fetch('/chat/refine', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ conversation: conversationHistory })
      });

      const reply = await res.text();
      chatLog.lastChild.remove();
      appendMessage(reply, 'bot');
      conversationHistory.push({ role: 'assistant', content: reply });

      submitBtn.style.display = 'block';
    };

    submitBtn.onclick = async () => {
      const refined = conversationHistory
        .filter(m => m.role === 'assistant')
        .slice(-1)[0]?.content;

      if (!refined) return;

      appendMessage("Scoring your idea...", 'bot');

      const scoreRes = await fetch('/chat/score', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ idea: refined })
      });

      const score = await scoreRes.json();
      appendMessage(`Score:\nClarity: ${score.clarity}\nValue: ${score.value}\nComplexity: ${score.complexity}`, 'bot');

      submitBtn.style.display = 'none';
    };
  </script>
</body>
</html>
