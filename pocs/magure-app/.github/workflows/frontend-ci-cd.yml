# 🏪 Frontend CI/CD Pipeline (Simplified)
# This workflow automatically builds and deploys your React frontend

name: Frontend CI/CD

# 🚀 When to run this workflow
on:
  push:
    branches: [ main, develop, staging ]    # Run on these branches
    paths: [ 'frontend/**' ]               # Only when frontend changes
  pull_request:
    branches: [ main ]
    paths: [ 'frontend/**' ]

# 🔧 Environment variables used across all jobs
env:
  NODE_VERSION: '18'
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/frontend

jobs:
  # ✅ Step 1: Test the frontend code
  test:
    name: 🧪 Test Frontend
    runs-on: ubuntu-latest
    
    steps:
      # Download the code
      - name: 📥 Checkout Code
        uses: actions/checkout@v4
      
      # Set up Node.js
      - name: 🔧 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      
      # Install dependencies
      - name: 📦 Install Dependencies
        working-directory: frontend
        run: npm ci
      
      # Run tests
      - name: 🧪 Run Tests
        working-directory: frontend
        run: npm run test -- --coverage --watchAll=false
      
      # Check code quality
      - name: 🔍 Lint Code
        working-directory: frontend
        run: npm run lint

  # 🏗️ Step 2: Build and push Docker image
  build:
    name: 🏗️ Build & Push
    runs-on: ubuntu-latest
    needs: test                            # Only run if tests pass
    if: github.event_name == 'push'       # Only on push, not PR
    
    outputs:
      image: ${{ steps.image.outputs.image }}
    
    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4
      
      # Log in to GitHub Container Registry
      - name: 🔐 Login to Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      
      # Extract metadata (tags, labels)
      - name: 🏷️ Extract Metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,prefix={{branch}}-
      
      # Build and push Docker image
      - name: 🐳 Build and Push Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            REACT_APP_ENVIRONMENT=${{ github.ref_name }}
      
      # Output image for deployment
      - name: 📤 Output Image
        id: image
        run: echo "image=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.ref_name }}-${{ github.sha }}" >> $GITHUB_OUTPUT

  # 🚀 Step 3: Deploy to environments
  deploy:
    name: 🚀 Deploy
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push'
    
    strategy:
      matrix:
        environment: 
          - ${{ github.ref_name == 'main' && 'production' || github.ref_name == 'staging' && 'staging' || 'development' }}
    
    environment: ${{ matrix.environment }}
    
    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4
      
      # Deploy to development (auto)
      - name: 🚀 Deploy to Development
        if: matrix.environment == 'development'
        run: |
          echo "🚀 Deploying to Development Environment"
          # Add your development deployment commands here
          # Example: kubectl set image deployment/frontend frontend=${{ needs.build.outputs.image }}
      
      # Deploy to staging (auto)
      - name: 🚀 Deploy to Staging
        if: matrix.environment == 'staging'
        run: |
          echo "🚀 Deploying to Staging Environment"
          # Add your staging deployment commands here
      
      # Deploy to production (manual approval required)
      - name: 🚀 Deploy to Production
        if: matrix.environment == 'production'
        run: |
          echo "🚀 Deploying to Production Environment"
          # Add your production deployment commands here

  # 🔔 Step 4: Notify team (optional)
  notify:
    name: 🔔 Notify Team
    runs-on: ubuntu-latest
    needs: [test, build, deploy]
    if: always() && github.event_name == 'push'
    
    steps:
      - name: 🔔 Send Notification
        if: always()
        run: |
          if [ "${{ needs.test.result }}" == "success" ] && [ "${{ needs.build.result }}" == "success" ] && [ "${{ needs.deploy.result }}" == "success" ]; then
            echo "✅ Frontend deployment successful!"
            # Add Slack/Discord/email notification here
          else
            echo "❌ Frontend deployment failed!"
            # Add failure notification here
          fi