# Development configuration for multi-tenant routing
# Handles *.maglabs.local domains

upstream backend_servers {
    server backend:8000;
    keepalive 32;
}

upstream frontend_servers {
    server frontend:3000;
    keepalive 32;
}

# Default server block - handles direct IP access
server {
    listen 80 default_server;
    server_name _;
    
    location / {
        return 444;  # Drop connection for unknown hosts
    }
    
    location /health {
        access_log off;
        return 200 "nginx healthy\n";
        add_header Content-Type text/plain;
    }
}

# API server block - handles *.maglabs.api domains
server {
    listen 80;
    server_name ~^(?<tenant>[^.]+)\.maglabs\.api$;
    
    # Set tenant header for Django
    set $tenant_header $tenant;
    
    # API routes
    location /api/ {
        limit_req zone=api burst=20 nodelay;
        
        proxy_pass http://backend_servers;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Tenant-Name $tenant_header;
        
        # WebSocket support
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        
        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        
        # Buffering
        proxy_buffering on;
        proxy_buffer_size 4k;
        proxy_buffers 8 4k;
        proxy_busy_buffers_size 8k;
    }
    
    # Admin routes
    location /admin/ {
        limit_req zone=auth burst=10 nodelay;
        
        proxy_pass http://backend_servers;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Tenant-Name $tenant_header;
    }
    
    # Static files served by Django
    location /static/ {
        proxy_pass http://backend_servers;
        proxy_set_header Host $host;
        proxy_set_header X-Tenant-Name $tenant_header;
        
        # Cache static files
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    
    # Media files served by Django
    location /media/ {
        proxy_pass http://backend_servers;
        proxy_set_header Host $host;
        proxy_set_header X-Tenant-Name $tenant_header;
        
        # Cache media files
        expires 30d;
        add_header Cache-Control "public";
    }
    
    # Health check
    location /health/ {
        proxy_pass http://backend_servers;
        access_log off;
    }
}

# Frontend server block - handles *.maglabs.local domains
server {
    listen 80;
    server_name ~^(?<tenant>[^.]+)\.maglabs\.local$;
    
    # Set tenant header
    set $tenant_header $tenant;
    
    # Root location - serve frontend
    location / {
        proxy_pass http://frontend_servers;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Tenant-Name $tenant_header;
        
        # Handle React Router
        try_files $uri $uri/ @fallback;
    }
    
    # Fallback for React Router
    location @fallback {
        proxy_pass http://frontend_servers;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Tenant-Name $tenant_header;
    }
    
    # API proxy to backend
    location /api/ {
        limit_req zone=api burst=20 nodelay;
        
        proxy_pass http://backend_servers;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Tenant-Name $tenant_header;
        
        # WebSocket support
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
    
    # WebSocket endpoint
    location /ws/ {
        proxy_pass http://backend_servers;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Tenant-Name $tenant_header;
    }
    
    # Static and media files
    location /static/ {
        proxy_pass http://backend_servers;
        proxy_set_header X-Tenant-Name $tenant_header;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    
    location /media/ {
        proxy_pass http://backend_servers;
        proxy_set_header X-Tenant-Name $tenant_header;
        expires 30d;
        add_header Cache-Control "public";
    }
    
    # Frontend health check
    location /health {
        proxy_pass http://frontend_servers;
        access_log off;
    }
}