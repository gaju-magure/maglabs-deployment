# ☁️ Deploy to AWS (Simplified)
# This workflow deploys your application to AWS ECS

name: Deploy to AWS

# 🚀 When to run this workflow
on:
  push:
    branches: [ main ]                     # Only deploy from main branch
  workflow_dispatch:                      # Allow manual deployment
    inputs:
      environment:
        description: 'Environment to deploy to'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production

# 🔧 Environment variables
env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY_BACKEND: maglabs-backend
  ECR_REPOSITORY_FRONTEND: maglabs-frontend
  ECR_REPOSITORY_NGINX: maglabs-nginx
  ECS_CLUSTER: maglabs-production
  ECS_SERVICE_BACKEND: backend
  ECS_SERVICE_FRONTEND: frontend
  ECS_SERVICE_NGINX: nginx

jobs:
  # 🏗️ Step 1: Build and push all images to ECR
  build-and-push:
    name: 🏗️ Build & Push to ECR
    runs-on: ubuntu-latest
    
    outputs:
      backend-image: ${{ steps.backend-image.outputs.image }}
      frontend-image: ${{ steps.frontend-image.outputs.image }}
      nginx-image: ${{ steps.nginx-image.outputs.image }}
    
    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4
      
      # Configure AWS credentials
      - name: 🔐 Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}
      
      # Login to Amazon ECR
      - name: 🔐 Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2
      
      # Build and push backend image
      - name: 🏭 Build & Push Backend Image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY_BACKEND:$IMAGE_TAG ./backend --target production
          docker push $ECR_REGISTRY/$ECR_REPOSITORY_BACKEND:$IMAGE_TAG
      
      - name: 📤 Output Backend Image
        id: backend-image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: echo "image=$ECR_REGISTRY/$ECR_REPOSITORY_BACKEND:$IMAGE_TAG" >> $GITHUB_OUTPUT
      
      # Build and push frontend image
      - name: 🏪 Build & Push Frontend Image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY_FRONTEND:$IMAGE_TAG ./frontend --target production
          docker push $ECR_REGISTRY/$ECR_REPOSITORY_FRONTEND:$IMAGE_TAG
      
      - name: 📤 Output Frontend Image
        id: frontend-image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: echo "image=$ECR_REGISTRY/$ECR_REPOSITORY_FRONTEND:$IMAGE_TAG" >> $GITHUB_OUTPUT
      
      # Build and push nginx image
      - name: 🚪 Build & Push Nginx Image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY_NGINX:$IMAGE_TAG ./nginx
          docker push $ECR_REGISTRY/$ECR_REPOSITORY_NGINX:$IMAGE_TAG
      
      - name: 📤 Output Nginx Image
        id: nginx-image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: echo "image=$ECR_REGISTRY/$ECR_REPOSITORY_NGINX:$IMAGE_TAG" >> $GITHUB_OUTPUT

  # 🚀 Step 2: Deploy to ECS
  deploy:
    name: 🚀 Deploy to ECS
    runs-on: ubuntu-latest
    needs: build-and-push
    environment: ${{ github.event.inputs.environment || 'staging' }}
    
    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4
      
      # Configure AWS credentials
      - name: 🔐 Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}
      
      # Update ECS service with new backend image
      - name: 🏭 Deploy Backend to ECS
        run: |
          # Get current task definition
          aws ecs describe-task-definition \
            --task-definition $ECS_SERVICE_BACKEND \
            --query 'taskDefinition' > backend-task-def.json
          
          # Update image in task definition
          jq --arg IMAGE "${{ needs.build-and-push.outputs.backend-image }}" \
            '.containerDefinitions[0].image = $IMAGE' \
            backend-task-def.json > backend-task-def-new.json
          
          # Register new task definition
          aws ecs register-task-definition \
            --cli-input-json file://backend-task-def-new.json
          
          # Update service
          aws ecs update-service \
            --cluster $ECS_CLUSTER \
            --service $ECS_SERVICE_BACKEND \
            --task-definition $ECS_SERVICE_BACKEND \
            --force-new-deployment
      
      # Update ECS service with new frontend image
      - name: 🏪 Deploy Frontend to ECS
        run: |
          # Get current task definition
          aws ecs describe-task-definition \
            --task-definition $ECS_SERVICE_FRONTEND \
            --query 'taskDefinition' > frontend-task-def.json
          
          # Update image in task definition
          jq --arg IMAGE "${{ needs.build-and-push.outputs.frontend-image }}" \
            '.containerDefinitions[0].image = $IMAGE' \
            frontend-task-def.json > frontend-task-def-new.json
          
          # Register new task definition
          aws ecs register-task-definition \
            --cli-input-json file://frontend-task-def-new.json
          
          # Update service
          aws ecs update-service \
            --cluster $ECS_CLUSTER \
            --service $ECS_SERVICE_FRONTEND \
            --task-definition $ECS_SERVICE_FRONTEND \
            --force-new-deployment
      
      # Wait for deployment to complete
      - name: ⏳ Wait for Deployment
        run: |
          echo "🕐 Waiting for backend deployment..."
          aws ecs wait services-stable \
            --cluster $ECS_CLUSTER \
            --services $ECS_SERVICE_BACKEND
          
          echo "🕐 Waiting for frontend deployment..."
          aws ecs wait services-stable \
            --cluster $ECS_CLUSTER \
            --services $ECS_SERVICE_FRONTEND
          
          echo "✅ Deployment completed!"
      
      # Run health checks
      - name: 🔍 Health Check
        run: |
          echo "🔍 Running health checks..."
          # Add your health check URLs here
          # curl -f https://your-domain.com/health/ || exit 1
          echo "✅ Health checks passed!"

  # 🔔 Step 3: Notify team
  notify:
    name: 🔔 Notify Deployment
    runs-on: ubuntu-latest
    needs: [build-and-push, deploy]
    if: always()
    
    steps:
      - name: 🔔 Send Notification
        run: |
          if [ "${{ needs.deploy.result }}" == "success" ]; then
            echo "✅ AWS deployment successful!"
            # Add success notification (Slack, Discord, etc.)
          else
            echo "❌ AWS deployment failed!"
            # Add failure notification
          fi