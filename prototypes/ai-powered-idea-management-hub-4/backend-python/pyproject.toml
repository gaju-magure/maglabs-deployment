[tool.poetry]
name = "ai-powered-idea-management-hub-backend"
version = "0.1.0"
description = "Python backend for the AI-Powered Idea Management Hub"
authors = ["Your Name <you@example.com>"] # Replace with actual author
readme = "README.md"
packages = [{include = "app", from = "."}]

[tool.poetry.dependencies]
python = "^3.12"
fastapi = ">=0.111.0"
uvicorn = {extras = ["standard"], version = "^0.29.0"}
pydantic = {extras = ["email"], version = "^2.7.1"}
pydantic-settings = "^2.2.1"
supabase = "^2.4.2" # supabase-py
litellm = "^1.38.0" # Unified interface for multiple LLM providers
python-dotenv = "^1.0.1"
httpx = "^0.27.0" # For async HTTP requests (e.g., to Supabase or external services if needed)
passlib = {extras = ["bcrypt"], version = "^1.7.4"} # For password hashing if not solely relying on Supabase Auth
python-jose = {extras = ["cryptography"], version = "^3.3.0"} # For JWT handling

[tool.poetry.group.dev.dependencies]
pytest = "^8.2.0"
pytest-asyncio = "^0.23.6"
ruff = "^0.4.4"
black = "^24.4.2" # Black is also available via ruff format
isort = "^5.13.2" # isort is also available via ruff format
mypy = "^1.10.0"
httpx = "^0.27.0" # For testing FastAPI endpoints
faker = "^25.2.0" # For generating fake data in tests
pytest-cov = "^5.0.0" # For test coverage

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 120
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # Pyflakes
    "I",  # isort
    "C",  # flake8-comprehensions
    "B",  # flake8-bugbear
    "UP", # pyupgrade
    "ARG", # flake8-unused-arguments
    "SIM", # flake8-simplify
    "PTH", # flake8-use-pathlib
    "TRY", # tryceratops
    "RUF", # Ruff-specific rules
]
ignore = [
    "E501", # Line too long, handled by black/ruff format
    "B008", # Do not perform function calls in argument defaults.
    "C901", # Too complex.
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.black]
line-length = 120
target-version = ['py312']
# skip-string-normalization = true # To prevent issues with some SQL strings or specific formats

[tool.isort]
profile = "black"
line_length = 120
known_first_party = "app"
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true # Recommended to set to false for stricter checks once stubs are available
disallow_untyped_defs = true
check_untyped_defs = true

[[tool.mypy.overrides]]
module = "supabase.*"
ignore_missing_imports = true # Supabase-py might not have complete stubs

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["tests"]
# addopts = "--cov=app --cov-report=html --cov-report=term" # Enable coverage reports
