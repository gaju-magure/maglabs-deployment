
<!DOCTYPE html>

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brandOrange: '#FDA052',
            brandCyan: '#41E6F8',
            brandPurple: '#B96AF7',
            brandBlue: '#3077F3',
            primary: { // Based on brandBlue
              light: '#79A6FF', // Lighter shade
              DEFAULT: '#3077F3', 
              dark: '#1E5BC6',  // Darker shade
            },
            secondary: { // Based on brandOrange
              light: '#FFC58C', 
              DEFAULT: '#FDA052', 
              dark: '#E68430',   
            },
            accent: { // Based on brandPurple
              light: '#D29FFF',
              DEFAULT: '#B96AF7',
              dark: '#9F4DE0',
            },
            highlight: { // Based on brandCyan
              light: '#83F2FF',
              DEFAULT: '#41E6F8',
              dark: '#25D0E6',
            },
            neutral: {
              extralight: '#f8f9fa', // very light gray
              light: '#f3f4f6',     // gray-100
              DEFAULT: '#6b7280',   // gray-500 
              dark: '#374151',       // gray-700 (for less prominent text)
              darker: '#1f2937'     // gray-800 (for headlines, body text)
            }
          },
          fontFamily: {
            // Satoshi would be prepended if available locally: ['Satoshi', 'Montserrat', ...]
            sans: ['Montserrat', 'Roboto', 'Helvetica', 'Arial', 'sans-serif'], 
          },
        }
      }
    }
  </script>
