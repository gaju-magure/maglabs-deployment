# Basic Nginx configuration for Docker Compose setup
# This acts as a reverse proxy for frontend and backend services.

# user nginx; # Usually defined in the main nginx.conf from the base image
worker_processes auto; # Or set to the number of CPU cores

# error_log /var/log/nginx/error.log warn; # Define error log
# pid       /var/run/nginx.pid; # Define PID file

events {
    worker_connections 1024; # Max connections per worker
}

http {
    include       /etc/nginx/mime.types; # Include MIME types
    default_type  application/octet-stream;

    # Log format (optional, can use default)
    # log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
    #                   '$status $body_bytes_sent "$http_referer" '
    #                   '"$http_user_agent" "$http_x_forwarded_for"';
    # access_log  /var/log/nginx/access.log  main;

    sendfile        on; # Enable sendfile for efficiency
    # tcp_nopush     on; # Enable tcp_nopush
    keepalive_timeout  65; # Keepalive timeout
    # gzip  on; # Enable Gzip compression (optional)

    # Define upstreams for backend and frontend services
    # The names 'backend' and 'frontend' must match the service names in docker-compose.yml
    upstream backend_service {
        server backend:8000; # 'backend' is the service name, 8000 is its internal port
    }

    upstream frontend_service {
        server frontend:80; # 'frontend' is the service name, 80 is its internal Nginx port
    }

    server {
        listen 80; # Nginx proxy listens on port 80 within the Docker network
        server_name localhost; # Or your domain if applicable

        # Location for API requests
        location /api/ {
            proxy_pass http://backend_service; # Forward to the backend upstream
            
            # Standard proxy headers
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # WebSocket support (if your backend uses WebSockets, e.g., for notifications)
            # proxy_http_version 1.1;
            # proxy_set_header Upgrade $http_upgrade;
            # proxy_set_header Connection "upgrade";
            
            # Optional: Increase proxy timeouts if needed for long-running API calls
            # proxy_connect_timeout 60s;
            # proxy_send_timeout    60s;
            # proxy_read_timeout    60s;
        }

        # Location for all other requests (serve the frontend)
        location / {
            proxy_pass http://frontend_service; # Forward to the frontend upstream (Nginx serving React)
            
            # Standard proxy headers
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # If your frontend uses HTML5 history mode for routing (e.g., React Router)
            # you might need to ensure that Nginx (serving the frontend) correctly handles fallbacks.
            # This configuration here is for the proxy; the Nginx serving the React app
            # (in Dockerfile.frontend) would need its own try_files directive if not already configured.
            # Example for the Nginx serving React (inside its own conf):
            # location / {
            #   root /usr/share/nginx/html;
            #   index index.html index.htm;
            #   try_files $uri $uri/ /index.html;
            # }
        }

        # Optional: Custom error pages
        # error_page 500 502 503 504 /50x.html;
        # location = /50x.html {
        #     root /usr/share/nginx/html; # Or a custom path
        # }
    }
}
