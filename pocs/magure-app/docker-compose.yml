version: "3.9"

services:
  postgres:
    image: postgres:15
    container_name: magure_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: maglab
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
    container_name: magure_backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      # Override or add DB connection if not in .env
      POSTGRES_DB: maglab
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app

volumes:
  postgres_data:
