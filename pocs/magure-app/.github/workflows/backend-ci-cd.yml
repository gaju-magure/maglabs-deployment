# 🏭 Backend CI/CD Pipeline (Simplified)
# This workflow automatically tests and deploys your Django backend

name: Backend CI/CD

# 🚀 When to run this workflow
on:
  push:
    branches: [ main, develop, staging ]    # Run on these branches
    paths: [ 'backend/**' ]                # Only when backend changes
  pull_request:
    branches: [ main ]
    paths: [ 'backend/**' ]

# 🔧 Environment variables
env:
  PYTHON_VERSION: '3.11'
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/backend

jobs:
  # ✅ Step 1: Test the backend code
  test:
    name: 🧪 Test Backend
    runs-on: ubuntu-latest
    
    # 🗄️ Test database service
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_db
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    
    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4
      
      # Set up Python
      - name: 🐍 Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt
      
      # Install dependencies
      - name: 📦 Install Dependencies
        working-directory: backend
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-django coverage black flake8
      
      # Check code formatting
      - name: 🎨 Check Code Formatting
        working-directory: backend
        run: |
          black --check .
          flake8 . --max-line-length=88 --extend-ignore=E203,W503
      
      # Run tests
      - name: 🧪 Run Tests
        working-directory: backend
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/test_db
          SECRET_KEY: test-secret-key-for-ci
          DEBUG: true
        run: |
          coverage run -m pytest
          coverage report --show-missing
          coverage xml
      
      # Check Django setup
      - name: 🔍 Check Django Configuration
        working-directory: backend
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/test_db
          SECRET_KEY: test-secret-key-for-ci
        run: |
          python manage.py check
          python manage.py makemigrations --check --dry-run

  # 🏗️ Step 2: Build and push Docker image
  build:
    name: 🏗️ Build & Push
    runs-on: ubuntu-latest
    needs: test                            # Only run if tests pass
    if: github.event_name == 'push'       # Only on push, not PR
    
    outputs:
      image: ${{ steps.image.outputs.image }}
    
    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4
      
      # Log in to GitHub Container Registry
      - name: 🔐 Login to Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      
      # Extract metadata
      - name: 🏷️ Extract Metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,prefix={{branch}}-
      
      # Build and push Docker image
      - name: 🐳 Build and Push Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          target: production
      
      # Output image for deployment
      - name: 📤 Output Image
        id: image
        run: echo "image=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.ref_name }}-${{ github.sha }}" >> $GITHUB_OUTPUT

  # 🔒 Step 3: Security scan (optional but recommended)
  security:
    name: 🔒 Security Scan
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push'
    
    steps:
      - name: 🔍 Run Security Scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ needs.build.outputs.image }}
          format: 'sarif'
          output: 'trivy-results.sarif'
      
      - name: 📤 Upload Security Results
        uses: github/codeql-action/upload-sarif@v2
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'

  # 🚀 Step 4: Deploy to environments
  deploy:
    name: 🚀 Deploy
    runs-on: ubuntu-latest
    needs: [build, security]
    if: github.event_name == 'push'
    
    strategy:
      matrix:
        environment: 
          - ${{ github.ref_name == 'main' && 'production' || github.ref_name == 'staging' && 'staging' || 'development' }}
    
    environment: ${{ matrix.environment }}
    
    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4
      
      # Deploy to development
      - name: 🚀 Deploy to Development
        if: matrix.environment == 'development'
        run: |
          echo "🚀 Deploying backend to Development"
          # Example deployment commands:
          # docker-compose -f docker-compose.yml pull backend
          # docker-compose -f docker-compose.yml up -d backend
      
      # Deploy to staging
      - name: 🚀 Deploy to Staging
        if: matrix.environment == 'staging'
        run: |
          echo "🚀 Deploying backend to Staging"
          # Add staging deployment commands
      
      # Deploy to production (requires manual approval)
      - name: 🚀 Deploy to Production
        if: matrix.environment == 'production'
        run: |
          echo "🚀 Deploying backend to Production"
          # Add production deployment commands
          
      # Run post-deployment checks
      - name: ✅ Health Check
        if: always()
        run: |
          echo "🔍 Running health checks..."
          # Add health check commands here
          # Example: curl -f http://your-app/health/ || exit 1