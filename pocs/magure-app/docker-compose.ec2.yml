version: '3.8'

# EC2-specific Docker Compose overrides with persistent storage
# This file contains EC2-specific configurations for deployment

services:
  # PostgreSQL - EC2 configuration with persistent storage
  postgres:
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      # IMPORTANT: Use host mount for persistence across container recreations
      - ./postgres-data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d
      - ./backups:/backups
    ports: []  # Don't expose ports externally
    restart: unless-stopped
    # Ensure postgres user has correct permissions
    command: >
      bash -c "
      chown -R postgres:postgres /var/lib/postgresql/data || true &&
      docker-entrypoint.sh postgres
      "

  # Django Backend - EC2 configuration
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: production
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings.production
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=${DB_NAME}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DEBUG=false
      - SECRET_KEY=${SECRET_KEY}
      - ALLOWED_HOSTS=${ALLOWED_HOSTS}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS}
      - MAGLABS_API_URL=${MAGLABS_API_URL}
      - MAGLABS_API_KEY=${MAGLABS_API_KEY}
      - USE_S3=false
      - EMAIL_HOST=${EMAIL_HOST:-localhost}
      - EMAIL_PORT=${EMAIL_PORT:-587}
      - EMAIL_USE_TLS=${EMAIL_USE_TLS:-true}
      - DEFAULT_FROM_EMAIL=${DEFAULT_FROM_EMAIL:-noreply@localhost}
      - DOMAIN_NAME=${DOMAIN_NAME}
    volumes:
      - ./backend-static:/app/staticfiles
      - ./backend-media:/app/mediafiles
      - ./logs:/app/logs
    ports: []  # Don't expose ports externally
    restart: unless-stopped
    depends_on:
      - postgres

  # React Frontend - EC2 configuration
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: production
      args:
        - REACT_APP_API_URL=https://${DOMAIN_NAME}/api
        - REACT_APP_WS_URL=wss://${DOMAIN_NAME}/ws
    ports: []  # Don't expose ports externally
    restart: unless-stopped
    depends_on:
      - backend

  # Nginx - EC2 configuration with subdomain routing
  nginx:
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./nginx/conf.d/ec2.conf:/etc/nginx/conf.d/default.conf
      - ./backend-static:/var/www/static:ro
      - ./backend-media:/var/www/media:ro
      - ./certbot/conf:/etc/letsencrypt:ro
      - ./certbot/www:/var/www/certbot:ro
    ports:
      - "80:80"    # HTTP
      - "443:443"  # HTTPS
    restart: unless-stopped
    depends_on:
      - frontend
      - backend
    environment:
      - DOMAIN_NAME=${DOMAIN_NAME}

  # Certbot for SSL certificates
  certbot:
    image: certbot/certbot
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"
    restart: unless-stopped

# Remove volume definitions to use host mounts instead
volumes: {}

networks:
  maglabs_network:
    driver: bridge